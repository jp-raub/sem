name: モック本体移行の一回限りの準備
on:
  push:
    branches: [implementation/mock-first-runtime]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/implementation/mock-first-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 固定モック移行と稼働版再接続の二段階commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import traceback
          try:
           from pathlib import Path
           import subprocess,json,base64,shutil
           base='812b2784212e9015ecbbce31280e48cb0bc65e84'
           mock='9cf8b031258fa1c9afe9668f54e61f002c4bce17'
           def run(*a):return subprocess.check_output(a).decode().strip()
           assert run('git','rev-parse','origin/main')==base
           assert run('git','rev-parse','origin/backup/main-before-mock-first-20261026')==base
           subprocess.run(['git','fetch','origin',mock],check=True)
           subprocess.run(['git','rm','-rf','.'],check=True,stdout=subprocess.DEVNULL)
           # First preserve exactly the approved UI sources, not the old product UI.
           subprocess.run(['git','checkout',mock,'--','mock'],check=True)
           Path('src/Sem.Web').mkdir(parents=True,exist_ok=True)
           shutil.move('mock','src/Sem.Web/wwwroot')
           subprocess.run(['git','add','-A'],check=True)
           subprocess.run(['git','commit','-m','採用モックv33を本体へ移行し旧実装を保全履歴へ分離'],check=True)
           files=json.loads(base64.b64decode(''))
           for path,content in files.items():
            p=Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
           subprocess.run(['git','add','-A'],check=True)
           subprocess.run(['git','commit','-m','稼働版ページと厳密な公開後照合を最優先で再接続'],check=True)
           result=subprocess.run(['git','push','origin','HEAD:refs/heads/implementation/mock-first-runtime'],capture_output=True,text=True)
           if result.returncode:
            print('::error::'+result.stderr.replace(chr(10),' | '))
            raise RuntimeError('Branch push rejected')
          except Exception:
           print('::error::'+traceback.format_exc().replace('\n',' | '))
           raise
          PY
