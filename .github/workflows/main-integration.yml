name: Main integration verification
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main, ci/main-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record source and validate scripts
        run: |
          set -euo pipefail
          bash -n scripts/integration-checks.sh scripts/build-integration-projects.sh
          mkdir -p verification
          printf 'event=%s\nref=%s\nsha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" > verification/event.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages (never build outputs)
        continue-on-error: true # Cache availability is optional; verification is not.
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet10-nuget-v1-integration-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-nuget-v1-integration-
      - name: Verify exact merged tree without deployment
        run: bash scripts/integration-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-integration-verification
          path: verification/
          retention-days: 7

  acceptance-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages (never build outputs)
        continue-on-error: true # Cache availability is optional; verification is not.
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet10-nuget-v1-browser-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-nuget-v1-browser-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/sem-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/sem-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify keyboard and touch field help above dialogs
        env:
          NODE_PATH: ${{ runner.temp }}/sem-browser/node_modules
        run: |
          node scripts/field-help-browser-checks.cjs
          node scripts/operation-feedback-browser-checks.cjs
          node scripts/service-navigation-lifecycle-checks.cjs
      - name: Verify populated local acceptance and whole-directory restore
        env:
          NODE_PATH: ${{ runner.temp }}/sem-browser/node_modules
        run: bash scripts/acceptance-browser-fixture.sh
      - name: Summarize failed acceptance location without private logs
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,re
          root=pathlib.Path('verification/acceptance-native')
          result=json.loads((root/'e2e-result.json').read_text()) if (root/'e2e-result.json').exists() else {'passed':0,'checks':[]}
          error=(root/'e2e-error.txt').read_text() if (root/'e2e-error.txt').exists() else ''
          frames=re.findall(r'scripts/[A-Za-z0-9_-]+\.cjs:[0-9]+:[0-9]+',error)
          last=result['checks'][-1] if result['checks'] else 'No browser check completed'
          print('::error title=Acceptance failure location::passed='+str(result['passed'])+'; last='+last+'; frames='+','.join(frames))
          match=re.search(r'Matrix keyboard selection state (\{[^\n]+?\});',error)
          if match:
              state=json.loads(match.group(1))
              allowed={'disabled','pressed','focused','interactive','selections'}
              if set(state)==allowed and all(type(v) in (bool,int) or v in (None,'true','false') for v in state.values()):
                  print('::error title=Matrix selection state::'+json.dumps(state,sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-browser-results
          path: verification/acceptance-native/e2e-result.json
          retention-days: 7
