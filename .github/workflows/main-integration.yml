name: Main integration verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 変更範囲を判定（判定不能は全検査）
        id: scope
        run: |
          python3 scripts/test-scope-checks.py
          python3 scripts/test-scope.py
      - name: 固定モック・版・保護契約の集中検証
        run: |
          set -euo pipefail
          python3 scripts/mock-checks.py
          python3 scripts/ui-inventory-checks.py
          if [[ "${{ steps.scope.outputs.storage }}" == "true" ]]; then
            python3 scripts/storage-source-checks.py
            dotnet run --project tests/Sem.Storage.Checks -c Release
          fi
          python3 scripts/cd/release_gate_checks.py
          python3 scripts/cd/updater_checks.py
          python3 scripts/cd/observe_checks.py
          dotnet publish src/Sem.Web -c Release -o /tmp/sem -p:SemCommit="$GITHUB_SHA" -p:SemPublicationRun="$GITHUB_RUN_ID" -p:SemPublicationAttempt="$GITHUB_RUN_ATTEMPT"
          (cd /tmp/sem; dotnet Sem.Web.dll --urls http://127.0.0.1:8765 > /tmp/sem.log 2>&1) &
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/health/live && break; sleep 1; done
          python3 scripts/runtime-checks.py http://127.0.0.1:8765 "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
  acceptance-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: モックと版表示の実ブラウザー検証
        run: |
          set -euo pipefail
          npm install --prefix /tmp/sem-browser playwright@1.56.1
          export NODE_PATH=/tmp/sem-browser/node_modules
          /tmp/sem-browser/node_modules/.bin/playwright install --with-deps chromium
          dotnet publish src/Sem.Web -c Release -o /tmp/sem
          (cd /tmp/sem; dotnet Sem.Web.dll --urls http://127.0.0.1:8765 > /tmp/sem.log 2>&1) &
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/health/live && break; sleep 1; done
          node scripts/runtime-browser.cjs
          node scripts/ui-inventory-browser.cjs
