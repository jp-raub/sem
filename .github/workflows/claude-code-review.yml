name: Claude Code Review

# 自動実行しない（pushごとの多エージェントレビューは利用枠を大きく消費する）。
# 認証・権限・保存など影響の大きいPRにだけ、ラベル ai-review を付けたときに実行する。
on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # モデルと反復回数を明示して費用を抑える（未指定だとClaude Codeの既定＝Opusで動く）
          claude_args: '--model sonnet --max-turns 30 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
