name: Manual notification Push policy admission
on:
  push:
    branches: [feat/manual-notification-push-policy]
  pull_request:
    branches: [feat/manual-notification-device-preflight]
    paths:
      - src/**
      - tests/**
      - .github/workflows/manual-notification-push-policy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-notification-push-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release with warnings as errors
        run: |
          set -euo pipefail
          mkdir -p verification
          dotnet build src/Sem.Web -c Release -warnaserror 2>&1 | tee verification/device-preflight-build.log
      - name: Durable policy admission and all existing .NET regressions
        run: |
          set -euo pipefail
          suites=0
          for project in tests/*/*.csproj; do
            name=$(basename "$(dirname "$project")")
            dotnet run --project "$project" -c Release 2>&1 | tee "verification/${name}.log"
            suites=$((suites+1))
          done
          echo "::notice title=.NET regressions::All $suites suites completed. No transport, native UI, Docker or DXP claim."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-notification-push-policy-backend
          path: verification/*.log
          retention-days: 7
