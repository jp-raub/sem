name: Manager reception roster privacy and normalized search
on:
  push:
    branches: [feat/reception-roster]
  pull_request:
    branches: [feat/member-profile-view]
    paths:
      - src/**
      - tests/**
      - scripts/**
      - .github/workflows/reception-roster.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reception-roster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release build and storage safety checks
        run: |
          set -euo pipefail
          mkdir -p verification
          node scripts/event-push-service-worker-checks.cjs | tee verification/event-push-service-worker-checks.log
          dotnet run --project tests/Sem.ReceptionRosterChecks -c Release | tee verification/reception-roster-checks.log
          dotnet run --project tests/Sem.CommentChecks -c Release | tee verification/comment-checks.log
          dotnet run --project tests/Sem.PublicAnswerChecks -c Release | tee verification/public-answer-checks.log
          dotnet run --project tests/Sem.PartStartDeliveryChecks -c Release | tee verification/part-start-delivery-checks.log
          dotnet run --project tests/Sem.EventPushDeliveryChecks -c Release | tee verification/event-push-delivery-checks.log
          dotnet run --project tests/Sem.EventPushRuleChecks -c Release | tee verification/event-push-rule-checks.log
          dotnet run --project tests/Sem.PartStartPreferenceChecks -c Release | tee verification/part-start-preference-checks.log
          dotnet run --project tests/Sem.ReservationChecks -c Release | tee verification/reservation-checks.log
          dotnet run --project tests/Sem.NotificationPlanChecks -c Release | tee verification/notification-plan-checks.log
          dotnet run --project tests/Sem.DailyDigestChecks -c Release | tee verification/daily-digest-checks.log
          dotnet run --project tests/Sem.DigestChecks -c Release | tee verification/digest-checks.log
          dotnet run --project tests/Sem.BusinessNotificationChecks -c Release | tee verification/business-notification-checks.log
          dotnet run --project tests/Sem.ShorteningChecks -c Release | tee verification/shortening-calculation.log
          dotnet run --project tests/Sem.ShorteningIntegrationChecks -c Release | tee verification/shortening-integration.log
          rm -f verification/e2e-result.json verification/e2e-error.txt verification/rate-limit-result.json
          dotnet build src/Sem.Web -c Release 2>&1 | tee verification/migration-build.log
          dotnet run --project tests/Sem.StorageChecks -c Release 2>&1 | tee verification/storage-checks.log
          dotnet run --project tests/Sem.PasskeyProofChecks -c Release 2>&1 | tee verification/passkey-proof-checks.log
          dotnet run --project tests/Sem.ProgressChecks -c Release 2>&1 | tee verification/progress-checks.log
          dotnet run --project tests/Sem.TimetableChecks -c Release 2>&1 | tee verification/timetable-checks.log
          dotnet run --project tests/Sem.ParticipationChecks -c Release 2>&1 | tee verification/participation-checks.log
          dotnet run --project tests/Sem.SongChecks -c Release 2>&1 | tee verification/event-song-checks.log
          dotnet run --project tests/Sem.QuestionChecks -c Release 2>&1 | tee verification/event-question-checks.log
          dotnet run --project tests/Sem.DefinitionChecks -c Release 2>&1 | tee verification/part-definition-checks.log
          dotnet run --project tests/Sem.PhaseChecks -c Release 2>&1 | tee verification/event-phase-checks.log
          dotnet run --project tests/Sem.CoreChecks -c Release 2>&1 | tee verification/core-foundation-checks.log
          dotnet run --project tests/Sem.LegacyResetChecks -c Release 2>&1 | tee verification/legacy-event-reset-checks.log
          python3 tests/offline-reset-copy-checks.py | tee verification/offline-copy-checks.log
      - name: Build current and fixed legacy Docker images
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t sem-dxp:migration-ci -f deploy/Dockerfile .
          git worktree add --detach /tmp/sem-legacy 78b9a6cb6d25911b5c9c7a030efb71ab785d962d
          docker build --platform linux/amd64 -t sem-dxp:legacy-ci -f /tmp/sem-legacy/deploy/Dockerfile /tmp/sem-legacy
          git worktree add --detach /tmp/sem-foundation c951ffb134a59f85b2bb29a9b764cceb91f329fc
          docker build --platform linux/amd64 -t sem-dxp:foundation-ci -f /tmp/sem-foundation/deploy/Dockerfile /tmp/sem-foundation
      - name: Published Blazor asset inventory
        run: |
          set -euo pipefail
          docker create --name sem-asset-inventory sem-dxp:migration-ci
          trap 'docker rm -f sem-asset-inventory >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/sem-assets
          docker cp sem-asset-inventory:/app/wwwroot /tmp/sem-assets/wwwroot
          docker cp sem-asset-inventory:/app/Sem.Web.staticwebassets.endpoints.json /tmp/sem-assets/endpoints.json
          python3 - <<'PYASSETS'
          import pathlib,json
          root=pathlib.Path('/tmp/sem-assets/wwwroot')
          files=[str(p.relative_to(root))+' ('+str(p.stat().st_size)+')' for p in root.rglob('*') if p.is_file() and 'blazor.web' in p.name]
          j=json.loads(pathlib.Path('/tmp/sem-assets/endpoints.json').read_text())
          routes=[str(x.get('Route'))+' => '+str(x.get('AssetFile')) for x in j.get('Endpoints',[]) if 'blazor.web' in str(x.get('Route'))]
          assert (root/'_framework/blazor.web.js').is_file() and routes, 'Publish must include Blazor web JS and mapped endpoints'
          text='Files: '+str(files)+'; routes: '+str(routes[:15])
          print('::notice title=Published Blazor asset inventory::'+text.replace('%','%25').replace('\n','%0A'))
          PYASSETS
      - name: Empty database and restart smoke
        run: |
          set -euo pipefail
          docker volume create sem-migration-smoke
          docker run -d --name sem-migration-smoke \
            -p 127.0.0.1:18080:8080 -v sem-migration-smoke:/data \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e Sem__PublicUrl=https://localhost:18443/ \
            -e Sem__TrustedProxies__0="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" \
            sem-dxp:migration-ci
          trap 'docker logs sem-migration-smoke > verification/migration-smoke.log 2>&1 || true; docker rm -f sem-migration-smoke || true; docker volume rm sem-migration-smoke || true' EXIT
          ready() {
            for n in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:18080/health/ready; then return 0; fi
              sleep 1
            done
            return 1
          }
          ready
          SEM_RATE_TEST_URL=http://localhost:18080 node scripts/rate-limit-checks.cjs
          docker restart sem-migration-smoke
          sleep 2
          ready
      - name: Existing passkeys, protection keys, SMTP and scheduled worker across upgrade
        run: |
          set -euo pipefail
          npm install --prefix scripts --no-save playwright@1.56.0
          scripts/node_modules/.bin/playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/sem-key.pem -out /tmp/sem-cert.pem -days 1 -subj '/CN=localhost' >/dev/null 2>&1
          python3 scripts/smtp-fixture.py > /tmp/sem-smtp.log 2>&1 &
          SMTP_PID=$!
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18025/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18025/ >/dev/null
          export SEM_E2E_GATEWAY=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          docker volume create sem-migration-e2e
          cat > /tmp/sem-test-start.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          image=$1
          docker run -d --name sem-e2e \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:18080:8080 -v sem-migration-e2e:/data \
            -e Sem__PublicUrl=https://localhost:18443/ \
            -e Sem__TrustedProxies__0="$SEM_E2E_GATEWAY" \
            -e Sem__BootstrapSecret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            -e Smtp__Host=host.docker.internal -e Smtp__Port=2525 -e Smtp__From=fixture@example.test \
            -e Smtp__Tls=None -e Smtp__AllowInsecureLocalTest=true "$image"
          SCRIPT
          for n in $(seq 1 30); do if curl -fsS http://127.0.0.1:18025/ >/dev/null; then break; fi; sleep 1; done
          dotnet run --project tests/Sem.DailyDigestChecks -c Release -- --smtp | tee verification/daily-digest-smtp.log
          bash /tmp/sem-test-start.sh sem-dxp:legacy-ci
          trap 'docker logs sem-e2e > verification/migration-integration.log 2>&1 || true; docker rm -f sem-e2e || true; docker volume rm sem-migration-e2e || true; kill "$SMTP_PID" || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health/ready
          export SEM_STORAGE_UPGRADE_COMMAND='docker stop sem-e2e && docker rm sem-e2e && bash /tmp/sem-test-start.sh sem-dxp:foundation-ci'
          export SEM_PHASE_UPGRADE_COMMAND='docker stop sem-e2e && docker rm sem-e2e && bash /tmp/sem-test-start.sh sem-dxp:migration-ci'
          export SEM_PHASE_RESTART_COMMAND='docker restart sem-e2e'
          SEM_RECEPTION_ROSTER_CHECKS=1 SEM_MEMBER_PROFILE_CHECKS=1 SEM_COMMENT_CHECKS=1 SEM_PUBLIC_ANSWER_CHECKS=1 SEM_EVENT_PUSH_RULE_CHECKS=1 SEM_PART_START_PREFERENCE_CHECKS=1 SEM_RESERVATION_CHECKS=1 SEM_NOTIFICATION_PLAN_CHECKS=1 SEM_DIGEST_PREVIEW_CHECKS=1 SEM_BUSINESS_EMAIL_CHECKS=1 SEM_SHORTENING_CHECKS=1 SEM_PROGRESS_CHECKS=1 SEM_TIMETABLE_CHECKS=1 SEM_PARTICIPATION_CHECKS=1 SEM_SONG_CHECKS=1 SEM_QUESTION_CHECKS=1 SEM_DEFINITION_CHECKS=1 SEM_PHASE_CHECKS=1 SEM_PASSKEY_ADDITION_CHECKS=1 SEM_CORE_FOUNDATION_CHECKS=1 node scripts/e2e.cjs
      - name: Surface sanitized synthetic-test failure
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          import pathlib,json
          p=pathlib.Path('verification/e2e-error.txt')
          text=p.read_text()[:1600] if p.exists() else 'No E2E error file; failure preceded the browser test.'
          result=pathlib.Path('verification/e2e-result.json')
          if result.exists():
              j=json.loads(result.read_text());text+='\nPassed: '+str(j.get('passed'))+'; last: '+str(j.get('checks',[])[-1:])
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=Synthetic core acceptance diagnosis::'+text)
          PYDIAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-push-rules-verification
          path: |
            verification/migration-*.log
            verification/storage-checks.log
            verification/passkey-proof-checks.log
            verification/core-foundation-checks.log
            verification/event-phase-checks.log
            verification/part-definition-checks.log
            verification/event-question-checks.log
            verification/event-song-checks.log
            verification/event-push-rule-checks.log
            verification/part-start-preference-checks.log
            verification/reservation-checks.log
            verification/notification-plan-checks.log
            verification/daily-digest-checks.log
            verification/daily-digest-smtp.log
            verification/digest-checks.log
            verification/business-notification-checks.log
            verification/shortening-calculation.log
            verification/shortening-integration.log
            verification/progress-checks.log
            verification/timetable-checks.log
            verification/participation-checks.log
            verification/legacy-event-reset-checks.log
            verification/offline-copy-checks.log
            verification/e2e-result.json
            verification/rate-limit-result.json
            verification/e2e-error.txt
          retention-days: 7