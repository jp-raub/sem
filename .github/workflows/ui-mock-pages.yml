name: Deploy UI mock to Pages
on:
  push:
    branches: [ui/session-room-mock, main]
    paths:
      - 'mock/**'
      - '.github/workflows/ui-mock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-ui-mock
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ui-mock/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage mock browser assets and sample import
        run: |
          mkdir -p _site/ui-mock
          cp mock/index.html mock/styles.css mock/app.js mock/enhancements.js mock/enhancements.css mock/domain.js mock/domain.css mock/event-rules.js mock/definitions.js mock/profiles.js mock/profiles.css mock/completion.js mock/completion.css mock/attendance.js mock/profile-history.js mock/ux-complete.js mock/ux-complete.css _site/ui-mock/
          cp mock/sample-import.csv _site/ui-mock/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
