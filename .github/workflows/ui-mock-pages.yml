name: Deploy UI mock to Pages
on:
  push:
    branches: [ui/session-room-mock, main]
    paths:
      - 'mock/**'
      - '.github/workflows/ui-mock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-ui-mock
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ui-mock/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only mock browser assets
        run: |
          mkdir -p _site/ui-mock
          cp mock/index.html mock/styles.css mock/app.js _site/ui-mock/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
