name: CSV import history gates and read-only preview
on:
  push:
    branches: [feat/event-import]
  pull_request:
    branches: [feat/manual-notification-history-ui]
    paths:
      - src/**
      - tests/**
      - .github/workflows/event-import-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-import-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release and all .NET regressions
        run: |
          set -euo pipefail
          mkdir -p verification
          dotnet build src/Sem.Web -c Release -warnaserror 2>&1 | tee verification/import-build.log
          suites=0
          for project in tests/*/*.csproj; do
            name=$(basename "$(dirname "$project")")
            dotnet run --project "$project" -c Release 2>&1 | tee "verification/${name}.log"
            suites=$((suites+1))
          done
          echo "::notice title=.NET regressions::All $suites suites passed."
          echo '::notice title=Verification boundary::Core-only CSV preview and durable phase history; no import apply, HTTP/UI, external spreadsheet, real Push or deployment acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-import-preview-verification
          path: verification/*.log
          retention-days: 7
