name: DXP application build
on:
  push:
    branches: [test/dxp-external]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dxp-application-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/dxp-external
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare source
        run: python3 scripts/prepare-source.py
      - name: Restore and build
        id: compile
        run: |
          set -o pipefail
          dotnet restore src/Sem.Web/Sem.Web.csproj 2>&1 | tee restore.log
          dotnet build src/Sem.Web/Sem.Web.csproj --no-restore -c Release 2>&1 | tee build.log
      - name: Docker build (linux amd64)
        id: image
        if: steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          docker build --platform linux/amd64 -t sem-dxp:ci -f deploy/Dockerfile . 2>&1 | tee docker.log
      - name: Empty database and restart smoke test
        id: smoke
        if: steps.image.outcome == 'success'
        run: |
          set -euo pipefail
          docker volume create sem-ci-data
          docker run -d --name sem-ci -p 127.0.0.1:18080:8080 -v sem-ci-data:/data -e Sem__TrustedProxies__0=127.0.0.1 sem-dxp:ci
          trap 'docker logs sem-ci > smoke.log 2>&1 || true; docker rm -f sem-ci || true; docker volume rm sem-ci-data || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/health/ready > health.json; then break; fi
            sleep 1
          done
          grep -q storage-ready health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/Account/Register)" = 400
          docker restart sem-ci
          sleep 4
          curl -fsS http://127.0.0.1:18080/health/ready
          echo 'Empty DB creation, untrusted host rejection, restart storage readiness: passed' > smoke-summary.log
      - name: Record report and adjusted source
        if: always()
        env:
          COMPILE: ${{ steps.compile.outcome }}
          IMAGE: ${{ steps.image.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p verification
          printf '# DXP build report\n\nCommit: %s\nRun: https://github.com/%s/actions/runs/%s\n.NET build: %s\nDocker build: %s\nSmoke test: %s\n\nAuthentication and notification end-to-end validation pending.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$COMPILE" "$IMAGE" "$SMOKE" > verification/build-report.md
          for f in restore.log build.log docker.log smoke-summary.log smoke.log; do
            if [ -f "$f" ]; then tail -n 45 "$f" >> verification/build-report.md; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src verification
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record adjusted source and build result'
            git push origin HEAD:test/dxp-external
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxp-build-report
          path: verification/
